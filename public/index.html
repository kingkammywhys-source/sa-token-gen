<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SA Corporate Token Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Credit Card Visual */
        .card-container {
            perspective: 1000px;
            margin-bottom: 2rem;
        }

        .credit-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            position: relative;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease;
        }

        .credit-card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chip {
            width: 40px;
            height: 30px;
            background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #d4af37 100%);
            border-radius: 6px;
            position: relative;
        }

        .chip::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 15px;
            border: 1px solid #b8860b;
            border-radius: 2px;
        }

        .card-type {
            font-weight: bold;
            font-style: italic;
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        .card-number {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.4rem;
            letter-spacing: 2px;
            margin: 10px 0;
            word-break: break-all;
        }

        .card-details {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .label {
            color: var(--text-secondary);
            font-size: 0.7rem;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .value {
            font-weight: bold;
        }

        .status-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: var(--success);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .status-badge.active {
            opacity: 1;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 1rem;
        }

        .btn-generate {
            background-color: var(--accent);
            color: white;
        }

        .btn-generate:hover {
            background-color: var(--accent-hover);
        }

        .btn-copy {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        .btn-copy:hover {
            background-color: var(--border);
        }

        /* JSON Output */
        .json-output {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            color: var(--text-secondary);
            max-height: 150px;
            overflow-y: auto;
        }

        .loading {
            text-align: center;
            color: var(--accent);
            display: none;
            margin-top: 10px;
        }

        .error {
            color: #ef4444;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>SA Corporate Token</h1>

    <div class="card-container">
        <div class="credit-card" id="cardVisual">
            <div class="status-badge" id="statusBadge">ACTIVE</div>
            <div class="card-header">
                <div class="chip"></div>
                <div class="card-type" id="cardType">VISA CORPORATE</div>
            </div>
            <div class="card-number" id="displayPan">•••• •••• •••• ••••</div>
            <div class="card-details">
                <div>
                    <div class="label">Card Holder</div>
                    <div class="value">SA CORPORATE</div>
                </div>
                <div>
                    <div class="label">Expires</div>
                    <div class="value" id="displayExpiry">MM/YY</div>
                </div>
                <div>
                    <div class="label">CVV</div>
                    <div class="value" id="displayCvv">***</div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-generate" id="generateBtn">Generate New Token</button>
        <button class="btn-copy" id="copyBtn">Copy JSON</button>
    </div>

    <div class="loading" id="loading">Generating Secure Token...</div>
    <div class="error" id="error"></div>

    <div class="json-output" id="jsonOutput">// Click "Generate New Token" to create a token...</div>
</div>

<script>
    // Determine API URL based on current host (works for local dev or Cloudflare Pages)
    const API_BASE = window.location.origin; 

    const elements = {
        generateBtn: document.getElementById('generateBtn'),
        copyBtn: document.getElementById('copyBtn'),
        loading: document.getElementById('loading'),
        error: document.getElementById('error'),
        jsonOutput: document.getElementById('jsonOutput'),
        displayPan: document.getElementById('displayPan'),
        displayExpiry: document.getElementById('displayExpiry'),
        displayCvv: document.getElementById('displayCvv'),
        cardType: document.getElementById('cardType'),
        statusBadge: document.getElementById('statusBadge')
    };

    let currentTokenData = null;

    async function generateToken() {
        // Reset UI
        elements.error.style.display = 'none';
        elements.loading.style.display = 'block';
        elements.generateBtn.disabled = true;
        elements.jsonOutput.textContent = '// Generating...';
        
        try {
            const response = await fetch(`${API_BASE}/api/generate`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) {
                throw new Error(`Server error: ${response.status}`);
            }

            const data = await response.json();

            if (data.success && data.data) {
                updateUI(data.data);
                currentTokenData = data.data;
                elements.jsonOutput.textContent = JSON.stringify(data.data, null, 2);
                elements.statusBadge.classList.add('active');
            } else {
                throw new Error('Invalid response from server');
            }

        } catch (err) {
            console.error(err);
            elements.error.textContent = `Error: ${err.message}. Ensure server.js is running.`;
            elements.error.style.display = 'block';
        } finally {
            elements.loading.style.display = 'none';
            elements.generateBtn.disabled = false;
        }
    }

    function updateUI(card) {
        elements.displayPan.textContent = card.pan;
        elements.displayExpiry.textContent = card.expiry;
        elements.displayCvv.textContent = card.cvv;
        
        // Determine card type based on PAN prefix
        if (card.rawPan.startsWith('4')) {
            elements.cardType.textContent = 'VISA CORPORATE';
        } else if (card.rawPan.startsWith('5')) {
            elements.cardType.textContent = 'MASTERCARD CORP';
        } else {
            elements.cardType.textContent = 'AMEX CORPORATE';
        }
    }

    elements.generateBtn.addEventListener('click', generateToken);

    elements.copyBtn.addEventListener('click', () => {
        if (currentTokenData) {
            navigator.clipboard.writeText(JSON.stringify(currentTokenData)).then(() => {
                const originalText = elements.copyBtn.textContent;
                elements.copyBtn.textContent = 'Copied!';
                setTimeout(() => {
                    elements.copyBtn.textContent = originalText;
                }, 2000);
            }).catch(err => {
                alert('Failed to copy to clipboard');
            });
        } else {
            alert('Generate a token first.');
        }
    });

    // Auto-generate one on load
    generateToken();
</script>

</body>
</html>
